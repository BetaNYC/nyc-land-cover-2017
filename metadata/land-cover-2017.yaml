# Collection metadata for land-cover-2017. Every sentence below is either
# quoted or paraphrased from a source named in `sources`, or measured from the
# data with a command recorded in catalog/land-cover-2017/AGENTS.md.
#
# Source key used in the comments:
#   [portal]  NYC Open Data dataset page and view metadata, he6d-2qns
#   [xml]     NYC_2017_LiDAR_LandCover.img.xml, the ArcGIS metadata in the zip
#   [dict]    Data_Dictionary_Land_Cover.xlsx, attached to the portal record
#   [geomd]   CityOfNewYork/nyc-geo-metadata Metadata_LandCover.md
#   [vat]     NYC_2017_LiDAR_LandCover.img.vat.dbf, the raster attribute table
#   [law]     NYC Administrative Code section 23-502(d)

id: land-cover-2017
title: NYC Land Cover 2017 (6-inch, 8 classes)
description: >-
  A 6-inch resolution, 8-class land cover map of New York City, derived from
  the 2017 LiDAR capture and 2016 orthoimagery. Each pixel holds one class:
  tree canopy, grass/shrubs, bare soil, water, buildings, roads, other
  impervious, or railroads. The map was made for the city's Urban Tree Canopy
  assessment, so it maps from the top down: canopy that hangs over a road or a
  building counts as tree canopy. This is a mirror of the
  [NYC Open Data release](https://data.cityofnewyork.us/d/he6d-2qns),
  converted without changes to pixel values to a Cloud Optimized GeoTIFF in
  New York State Plane Long Island feet (EPSG:2263). The
  [AGENTS.md](AGENTS.md) shows how to read pixels and compute class areas
  without downloading the file.
keywords:   # [portal] tags, plus "urban tree canopy" from [xml] themeKeys
  - land cover
  - tree canopy
  - urban tree canopy
  - lidar
  - grass
  - shrub
  - bare soil
  - water
  - buildings
  - roads
  - impervious
  - railroad
  - new york city

# [geomd] Temporal Coverage 05/03/2017 - 05/17/2017 is the LiDAR flight window.
# [xml] the orthophotography was "acquired 2016" with no finer date, so the
# interval opens at the start of 2016.
temporal: ["2016-01-01T00:00:00Z", "2017-05-17T23:59:59Z"]

# The time this mirror was synced: the download of Land_Cover.zip.
updated: "2026-10-30T16:13:00Z"

providers:
