# [dict] Detailed Description, and [xml] idPurp.
uses:
  - >-
    Urban Tree Canopy assessment. The map was made for the city's updated
    Urban Tree Canopy assessment.
  - >-
    Hazard mitigation and green infrastructure planning. The data dictionary
    says the dataset "will be used by several City agencies for various types
    of analyses, such as hazard mitigation (coastal storms, sea level rise
    inundation, etc.) and green infrastructure planning". It also says the
    dataset was collected as part of the federal Community Development Block
    Grant – Disaster Recovery (CDBG-DR) award the City received after
    Superstorm Sandy.
  - >-
    Land cover shares by geography. The data dictionary says the dataset "may
    be used to assess percentage of land cover type per given geography", for
    example canopy or impervious share per borough, tract, or park.

# Each item follows from a property documented in the sources.
not_suited_for:
  - >-
    Measuring all paved or built area. Mapping is top-down, so pavement and
    roofs under tree canopy are classed as Tree Canopy.
  - >-
    Describing conditions after 2017. The map is a 2016–2017 snapshot, and
    this release has not changed since its publication in December 2018.
  - >-
    Counting trees, or measuring tree height or species. Pixels carry a class
    only; Tree Canopy means vegetation over 8 ft.
  - >-
    Comparing with the 2010 map class by class without first merging Railroads
    (8) into Roads (6).
  - >-
    Fine-scale Bare Soil mapping. The source reports a producer's accuracy of
    82% for Bare Soil, so about 18% of the reference Bare Soil sample points
    were mapped as another class.

biases:
  - >-
    Tree Canopy is favoured over what lies beneath it, by design (top-down
    mapping). Shares of Roads, Buildings, and Other Impervious are smaller than
    their ground footprint where trees overhang them.
  - >-
    The classes come from two dates: Tree Canopy and Buildings reflect the
    May 2017 LiDAR, the other classes the 2016 orthophotography.
  - >-
    Bare Soil is under-mapped relative to the other classes (producer's
    accuracy 82%, user's accuracy 89%).
  - >-
    The source publishes overall, user's, and producer's accuracies, but no
    confusion matrix and no per-pixel uncertainty layer.
