data:
  file: nyc-land-cover-2017.tif
  title: NYC Land Cover 2017 (Cloud Optimized GeoTIFF, EPSG:2263)
  band_name: land_cover_class
  band_description: >-
    Land cover class code, 1 to 8. 0 is NoData, outside the city boundary.

# Class names follow the attribute table [vat] and the data dictionary [dict].
# `name` is restricted to letters, digits, "-" and "_" by the classification
# extension, and the data browser shows it in the legend.
classes:
  - value: 0
    name: nodata
    title: NoData
    nodata: true
    description: Outside the New York City boundary. Transparent.
  - value: 1
    name: Tree-Canopy
    title: Tree Canopy
    color_hint: 2E7D32
    description: >-
      Vegetation taller than 8 ft, including canopy that overhangs other
      features. Current as of 2017.
  - value: 2
    name: Grass-Shrubs
    title: Grass/Shrubs
    color_hint: A6D96A
    description: Vegetation 8 ft or lower.
  - value: 3
    name: Bare-Soil
    title: Bare Soil
    color_hint: C8A165
    description: >-
      The least accurate class: user's accuracy 89%, producer's accuracy 82%.
  - value: 4
    name: Water
    title: Water
    color_hint: 4A90C8
  - value: 5
    name: Buildings
    title: Buildings
    color_hint: B5473A
    description: Current as of 2017.
  - value: 6
    name: Roads
    title: Roads
    color_hint: 3F3F3F
  - value: 7
    name: Other-Impervious
    title: Other Impervious
    color_hint: A9A9A9
  - value: 8
    name: Railroads
    title: Railroads
    color_hint: 7E4FA0
    description: >-
      New in the 2017 map. The 2010 map folded railroads into Roads (6).
      Reassign 8 to 6 to compare the two years.

accuracy: >-
  A per-pixel accuracy assessment based on 8,493 random points indicated an
  overall accuracy of 98%. User's and producer's accuracies for all classes
  except Bare Soil exceeded 94%; for bare soil, the user's and producer's
  accuracies were 89 and 82%, respectively.

method: >-
  Object-based image analysis (OBIA) with a rule-based expert system, run on
  the 2017 LiDAR point cloud (1-ft post spacing) and its derivatives, leaf-off
  2016 4-band orthophotography (0.5-ft), and city GIS layers such as building
  footprints, hydrography, roadbed, railroads, parking lots, sidewalks, parks,
  and athletic facilities. The result was then manually reviewed and corrected.
  Tree canopy and buildings are current as of 2017; the other classes as of
  2016.

processing_notes: >-
  Downloaded Land_Cover.zip (1,334,211,225 bytes) from NYC Open Data
  he6d-2qns on 2026-10-30. The zip holds an ERDAS Imagine raster,
  NYC_2017_LiDAR_LandCover.img with its .ige spill file, 310,844 x 314,414
  pixels of 0.5 ft. Converted with GDAL 3.13 (tools/build_cog.sh) to a COG:
  DEFLATE level 9 with no predictor (smaller than predictor 2 on a test
  window), 512 x 512 tiles, nearest-neighbour overviews, an embedded colour
  table, and exact statistics computed at creation. The source CRS is an
  unnamed Lambert Conformal Conic definition identical to EPSG:2263; the COG
  is labelled EPSG:2263. Pixel values are unchanged: the per-class pixel
  counts of the COG match the source attribute table exactly (see AGENTS.md).

known_issues:
  - >-
    The nyc-geo-metadata page says "only vegetation < 8 ft were classed as
    Tree Canopy". The NYC Open Data description and the data dictionary say
    "> 8 ft". This catalog follows the portal and the dictionary.
  - >-
    Classes are not all from the same year. Tree Canopy and Buildings are
    current as of 2017 (LiDAR, May 2017); the other classes as of 2016
    (orthophotography).
  - >-
    The source documentation defines Tree Canopy and Grass/Shrubs by height
    but gives no definition for Bare Soil, Water, Roads, Other Impervious, or
    Railroads beyond their names.
  - >-
    The histogram in the source's NYC_2017_LiDAR_LandCover.img.aux.xml is
    scaled down. Every class count is the attribute table count divided by
    21.64, and the counts sum to 2,147,483,646, just under the 32-bit integer
    limit. Its proportions are right, but it does not give pixel counts. Use
    the attribute table counts or the counts in this collection.

