    # [portal] attribution; [dict] names the agency under its former name,
    # the Department of Information Technology and Telecommunications.
    roles: [producer, licensor]
    url: https://www.nyc.gov/content/oti/pages/
  - name: University of Vermont Spatial Analysis Laboratory
    # [xml] idCredit: made by UVM SAL "in collaboration with" NYC DoITT,
    # AppGeo, and Quantum Spatial.
    roles: [producer, processor]
    url: https://www.uvm.edu/rsenr/sal

license: other
license_summary: >-
  NYC Open Data states no license for this dataset. NYC Administrative Code
  section 23-502(d) makes public data sets available "without any registration
  requirement, license requirement or restrictions on their use", and lets the
  city require anyone who redistributes a data set to identify its source and
  version and describe any changes. This catalog does both in its
  attribution and provenance.
license_links:
  - title: NYC Administrative Code, Title 23, Chapter 5 (section 23-502)
    href: https://nyc-laws.readthedocs.io/en/latest/nycadmincode/t23/c05/
  - title: NYC.gov Terms of Use
    href: https://www.nyc.gov/main/terms-of-use

attribution: >-
  Source: NYC Office of Technology and Innovation, "Land Cover Raster Data
  (2017) – 6in Resolution", NYC Open Data dataset he6d-2qns, file version of
  2018-12-07. Converted to a Cloud Optimized GeoTIFF by BetaNYC; pixel values
  unchanged.

source_url: https://data.cityofnewyork.us/d/he6d-2qns
